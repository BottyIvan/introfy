<!DOCTYPE html>
<html lang="en" xml:lang="en">
  <head>
    <meta charset="utf-8" />
    <title>404 Not Found</title>
    <script>
      // Get the segments of the current URL path, excluding empty ones
      const pathSegments = location.pathname.split("/").filter(Boolean);

      // Determine the base path (project root)
      // If there are segments, use the first as the base, otherwise use "/"
      const basePath = pathSegments.length > 0 ? `/${pathSegments[0]}/` : "/";

      // Redirect the user to the project root, keeping query string and hash
      location.replace(basePath + location.search + location.hash);
    </script>
  </head>
  <body></body>
</html>
